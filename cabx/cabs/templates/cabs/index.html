{% extends "cabs/layout.html" %}

{% block body %}
    <h1> Cabs!</h1>

    <ul>
        {% for cab in cabs %}
            <a href="{% url 'cab' cab.id %}">
                <li>Cab {{cab.id}}: {{ cab.pick }} to {{ cab.drop }}</li>
            </a>
            
        {% endfor %}    
    </ul>
        
{% endblock %}
